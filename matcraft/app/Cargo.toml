[package]
name = "matcraft"
version = "0.1.0"
edition = "2021"
description = "Design-and-cut studio for a Bluetooth cutting machine, built for Linux (Bazzite) and Windows"

[[bin]]
name = "matcraft"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
epaint_default_fonts = "0.37"
ttf-parser = "0.25"
aes = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
geo = { version = "0.33", default-features = false }
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
